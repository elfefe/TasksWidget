name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Une seule exécution par branche : pousser deux fois de suite n'occupe pas
# deux runners à construire la même chose.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build et tests
    # Linux suffit : on compile le module et on lance les tests JVM. La
    # fabrication de l'installeur MSI, elle, est Windows-only et vit dans
    # release.yml.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests et compilation
        run: ./gradlew :common:desktopTest :desktop:compileKotlinJvm --no-daemon

      - name: Rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: common/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

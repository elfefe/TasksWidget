name: Release

# Poser un tag v* (ex. v1.4.4) produit l'installeur MSI et une release GitHub,
# sans intervention manuelle.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # nécessaire pour créer la release et y attacher le MSI

jobs:
  msi:
    name: Construire le MSI et publier la release
    # L'installeur MSI ne se fabrique que sous Windows (jpackage + WiX).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # WiX n'est plus versionné dans le dépôt (c'était 220 fichiers de toolset).
      # On l'installe sur le runner ; Compose/jpackage le trouve alors sur le PATH.
      - name: WiX Toolset
        run: choco install wixtoolset --no-progress -y

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      # MSI non signé : le certificat de signature a été retiré du dépôt (il
      # était compromis). Pour signer, ajouter le nouveau certificat en secret
      # de dépôt et rebrancher la tâche signMsi.
      - name: Construire le MSI
        run: ./gradlew :desktop:packageMsi --no-daemon

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/compose/binaries/main/msi/*.msi
          generate_release_notes: true
          fail_on_unmatched_files: true
